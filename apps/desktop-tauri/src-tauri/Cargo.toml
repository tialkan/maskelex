[package]
name = "maskelex"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
name = "maskelex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
