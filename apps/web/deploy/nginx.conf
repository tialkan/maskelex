# apps/web/deploy/nginx.conf (MASTER 4.2). add_header alt bloklarda üsttekini ezdiği için her location ortak dosyayı içerir.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  location /assets/  { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /models/  { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /ort/     { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; types { application/wasm wasm; } }
  location = /sw.js  { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; }
  location = /surum.json { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store"; }
  location /         { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/index.html =404; }
}
