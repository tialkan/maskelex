name: ci
on: [push, pull_request]
jobs:
  temel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:acceptance
      - run: pnpm check:copy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  masaustu:
    # Gizli pano kodu (clipboard.rs) Windows ve macOS'a özgüdür; her iki hedefte de derlenir.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        shell: bash
        # Derleyici hataları GitHub notu olarak da yazılır (günlük indirilemeyen ortamlar için).
        run: |
          set -o pipefail
          cargo check --locked --message-format=short --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml 2>&1 \
            | tee check.log | sed -nE 's#^([^: ]+\.rs):([0-9]+):([0-9]+): (error|warning)(\[[A-Z0-9]+\])?: (.*)$#::\4 file=\1,line=\2,col=\3::\6#p'

  bagimlilik-denetimi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop-tauri/src-tauri/Cargo.toml
          command: check bans licenses
