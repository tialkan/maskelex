name: vitrin
# Tanıtım sayfası ve uygulama GitHub Pages'te: https://tialkan.github.io/maskelex/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:acceptance
      - run: pnpm --filter @maskelex/web build:pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist-pages }
      - id: deploy
        uses: actions/deploy-pages@v4
